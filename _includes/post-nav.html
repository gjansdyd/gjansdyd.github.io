<nav class="post-nav" aria-label="포스트 네비게이션">
  {% if page.previous %}
    <a class="prev" href="{{ page.previous.url | relative_url }}" aria-label="이전 포스트: {{ page.previous.title | escape }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15,18 9,12 15,6"></polyline>
      </svg>
      <div>
        <span class="post-nav__label">이전 포스트</span>
        <span class="post-nav__title">{{ page.previous.title | escape }}</span>
      </div>
    </a>
  {% endif %}
  {% if page.next %}
    <a class="next" href="{{ page.next.url | relative_url }}" aria-label="다음 포스트: {{ page.next.title | escape }}">
      <div>
        <span class="post-nav__label">다음 포스트</span>
        <span class="post-nav__title">{{ page.next.title | escape }}</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9,18 15,12 9,6"></polyline>
      </svg>
    </a>
  {% endif %}
</nav>
