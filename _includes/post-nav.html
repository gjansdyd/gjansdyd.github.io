{% if page.previous or page.next %}
<nav class="post-nav" aria-label="Post navigation">
  {% if page.previous %}
    <a class="post-nav__link post-nav__link--prev" href="{{ page.previous.url | relative_url }}">
      <div>
        <span class="post-nav__label">이전 글</span>
        <span class="post-nav__title">{{ page.previous.title | escape }}</span>
      </div>
    </a>
  {% endif %}
  {% if page.next %}
    <a class="post-nav__link post-nav__link--next" href="{{ page.next.url | relative_url }}">
      <div>
        <span class="post-nav__label">다음 글</span>
        <span class="post-nav__title">{{ page.next.title | escape }}</span>
      </div>
    </a>
  {% endif %}
</nav>
{% endif %}
