title: Munyong's Blog
description: Kpop 가사 철학 읽기 · Apple Docs 번역 · 기타 등등
theme: minima
timezone: Asia/Seoul
future: true

# 커스텀 헤드 포함
head_custom: true

# 헤더 메뉴에 표시할 페이지 (루트에 있는 .md 파일들)
header_pages:
  - kpop.md
  - apple.md
  - etc.md
  - new.md
  - search.md

# GitHub Pages에서 지원되는 플러그인만 사용
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 고정 URL 규칙 (옵션)
permalink: /:categories/:year/:month/:day/:title/

author:
  name: "Munyong Heo"

markdown: kramdown
highlighter: rouge
# rouge_theme: github   # (원하면 다른 테마명도 가능)
kramdown:
  input: GFM
  hard_wrap: false

defaults:
- scope: { path: "" }
  values:
    image: /assets/img/og-default.png
    read_time: true