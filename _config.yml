title: Munyong's Blog
description: 철학을 기반으로 기술로 구현합니다
timezone: Asia/Seoul
future: true

# GitHub Pages에서 지원되는 플러그인만 사용
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 고정 URL 규칙
permalink: /:categories/:year/:month/:day/:title/

author:
  name: "Munyong Heo"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

defaults:
- scope: { path: "" }
  values:
    image: /assets/img/og-default.png
    read_time: true