<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% include post-nav.html %}
</article>
